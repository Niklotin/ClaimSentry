services:
  postgres:
    image: postgres:16-alpine
    container_name: aika-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aika_claims}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aika-network

  aika-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aika-engine
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Host=postgres;Port=5432;Database=aika_claims;Username=postgres;Password=postgres}
    ports:
      - "${AIKA_ENGINE_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aika-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: aika-n8n
    restart: unless-stopped
    environment:
      N8N_PORT: 5678
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Helsinki}
      N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:-filesystem}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/data/workflows
    depends_on:
      - aika-engine
    networks:
      - aika-network

volumes:
  postgres_data:
  n8n_data:

networks:
  aika-network:
    driver: bridge
